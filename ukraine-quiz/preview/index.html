<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Ukrainian are you?</title>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<meta name="description" content="A 20-question quiz about Ukraine. Pick an answer, see if you were right, find out how Ukrainian you are.">
<style>
  /* Layout: one centred card column, flag bands top and bottom, phone first. */
  :root {
    --blue: #0057B7;
    --blue-dark: #00458f;
    --blue-text: #0057B7;
    --yellow: #FFD700;
    --ink: #14181f;
    --muted: #5d6673;
    --paper: #ffffff;
    --paper-hover: #f6f9fe;
    --bg: #f3f5f9;
    --line: #dde2ea;
    --ok: #1f8a3b;
    --ok-bg: #e6f5ea;
    --bad: #c62828;
    --bad-bg: #fde8e8;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --radius: 14px;
  }
  :root[data-theme="dark"] {
    --blue-text: #7fb3ff; --ink: #eef2f7; --muted: #9aa6b5; --paper: #1a212c; --paper-hover: #202a37;
    --bg: #10151d; --line: #2c3645; --ok: #4ccb6f; --ok-bg: #16331f; --bad: #ff7b7b; --bad-bg: #3a1c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased;
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  .flag { display: flex; height: 8px; }
  .flag span { flex: 1; }
  .flag .b { background: var(--blue); }
  .flag .y { background: var(--yellow); }
  main {
    flex: 1; width: 100%; max-width: 592px; margin: 0 auto;
    padding-block: 16px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .topbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .theme {
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    border: 2px solid var(--line); background: var(--paper); color: var(--ink);
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: border-color .15s, background .15s;
  }
  .theme:hover { border-color: var(--blue-text); background: var(--paper-hover); }
  .theme:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .theme svg { width: 20px; height: 20px; display: block; }
  .theme .sun { display: none; }
  :root[data-theme="dark"] .theme .sun { display: block; }
  :root[data-theme="dark"] .theme .moon { display: none; }
  .card {
    background: var(--paper); border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 30px 20px 26px;
  }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -.01em; text-wrap: balance; }
  h2 { font-size: 22px; line-height: 1.25; margin: 0 0 18px; text-wrap: balance; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .tag {
    display: inline-block; background: var(--blue); color: var(--yellow);
    font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 6px; margin-bottom: 14px;
  }
  .btn {
    display: block; width: 100%; border: 0; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 17px;
    padding: 15px 18px; border-radius: 12px;
    background: var(--blue); color: #fff;
    transition: background .15s, transform .05s;
  }
  .btn:hover { background: var(--blue-dark); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, .opt:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .btn.secondary { background: transparent; color: var(--blue-text); border: 2px solid var(--blue-text); }
  .btn.secondary:hover { background: var(--paper-hover); }
  .btn + .btn { margin-top: 10px; }

  .progress { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 14px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
  .bar > div { height: 100%; background: var(--yellow); width: 0; transition: width .3s; }

  .opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .opt {
    text-align: left; width: 100%; border: 2px solid var(--line); background: var(--paper);
    font: inherit; font-size: 17px; color: var(--ink);
    padding: 14px 16px; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    transition: border-color .15s, background .15s;
  }
  .opt > span:last-child { min-width: 0; }
  .opt:hover:not(:disabled) { border-color: var(--blue-text); background: var(--paper-hover); }
  .opt:disabled { cursor: default; }
  .opt .mark {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: transparent;
  }
  .opt.correct { border-color: var(--ok); background: var(--ok-bg); }
  .opt.correct .mark { border-color: var(--ok); background: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.wrong .mark { border-color: var(--bad); background: var(--bad); color: #fff; }
  .opt.dim { opacity: .55; }

  .nav { display: flex; gap: 10px; align-items: center; }
  .nav .btn { margin: 0; }
  .nav .btn.small { width: auto; flex: 0 0 auto; padding: 13px 16px; font-size: 15px; }
  .nav .hint { margin: 0; font-size: 13px; }
  .verdict { font-weight: 800; font-size: 18px; margin: 0 0 6px; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .note { border-left: 4px solid var(--yellow); padding: 2px 0 2px 12px; margin: 0 0 18px; color: var(--ink); }

  .score { text-align: center; }
  .count { font-size: 18px; color: var(--muted); margin: 8px 0 18px; font-variant-numeric: tabular-nums; }
  .tier { font-size: 22px; font-weight: 800; margin: 0 0 22px; }
  .ring { width: 160px; height: 160px; max-width: 100%; margin: 0 auto 16px; display: block; }
  .ring .track { stroke: var(--line); }
  .ring .arc { stroke: var(--yellow); }
  .ring text { fill: var(--blue-text); font-family: inherit; }
  /* endings */
  .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
  .shower { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .shower span { position: absolute; top: -70px; line-height: 1; animation-name: fall; animation-timing-function: linear; animation-fill-mode: forwards; }
  @keyframes fall { to { transform: translateY(115vh) translateX(var(--sway, 0px)) rotate(380deg); } }
  .card.score { position: relative; overflow: hidden; }
  .stamp {
    position: absolute; left: 50%; top: 158px; transform: translate(-50%, -50%) rotate(-10deg);
    background: var(--yellow); color: var(--blue); border: 4px solid var(--blue); border-radius: 10px;
    padding: 6px 18px; font-weight: 900; font-size: clamp(26px, 9vw, 42px); letter-spacing: .08em; text-transform: uppercase;
    white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    animation: stamp .55s cubic-bezier(.2, 1.5, .4, 1) both;
  }
  @keyframes stamp { from { transform: translate(-50%, -50%) rotate(-10deg) scale(3); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-10deg) scale(1); opacity: 1; } }
  .varenyk { width: 260px; max-width: 100%; height: auto; margin: 0 auto 4px; display: block; }
  .varenyk .plate { fill: var(--paper); stroke: var(--blue); }
  .varenyk .rim { fill: none; stroke: var(--line); }
  .caption { font-size: 15px; color: var(--muted); margin: -10px 0 18px; }
  /* temporary preview of endings */
  .preview { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .preview h3 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
  .chip:hover { border-color: var(--blue-text); }
  .chip.on { border-color: var(--blue); background: var(--blue); color: #fff; }
  .demo { justify-content: center; margin: 14px 0 0; }
  @media (prefers-reduced-motion: reduce) { .stamp, .shower span { animation: none; } }
  footer {
    text-align: center; font-size: 12px; color: var(--muted);
    padding-block: 10px 18px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (prefers-reduced-motion: reduce) { .bar > div, .btn, .opt { transition: none; } }
  @media (max-width: 380px) { h1 { font-size: 26px; } }
</style>
</head>
<body>
<div class="flag"><span class="b"></span><span class="y"></span></div>
<main>
  <div class="topbar">
    <button class="theme" id="theme" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <div id="app" aria-live="polite"></div>
</main>
<footer>Gro Community · Ukrainian afterwork · Växjö, October 2026</footer>

<script>
const QUESTIONS = [
  { q: "What is Ukraine's currency?",
    options: ["Lev", "Zloty", "Hryvnia", "Lari"], answer: 2,
    note: "The hryvnia, ₴. Named after a unit of weight used in Kyivan Rus a thousand years ago." },
  { q: "What is a vyshyvanka?",
    options: ["A soup", "A dance", "A fur hat", "An embroidered shirt"], answer: 3,
    note: "The embroidered shirt. Every region has its own pattern, and Vyshyvanka Day is the third Thursday of May." },
  { q: "When was Ukraine's capital, Kyiv, founded?",
    options: ["482", "988", "1240", "1654"], answer: 0,
    note: "Officially 482, so Kyiv celebrated its 1,500th birthday in 1982." },
  { q: "True or false: Swedes founded a village in Ukraine in 1782, and a few people there still speak old Swedish.",
    options: ["True", "False"], answer: 0,
    note: "Gammalsvenskby in Kherson oblast, founded by Swedes from the island of Dagö. A handful of elderly villagers still speak the old dialect." },
  { q: "True or false: The last time a large Swedish army visited Ukraine, in 1709, it went well for Sweden.",
    options: ["True", "False"], answer: 1,
    note: "Battle of Poltava, 8 July 1709. Karl XII and Hetman Ivan Mazepa fought side by side and lost to Peter the Great." },
  { q: "You are invited to a Ukrainian home and bring flowers. How many?",
    options: ["10", "12", "11"], answer: 2,
    note: "Always an odd number. Even numbers are for funerals, so florists sell 11, 25 or 51 roses, never a dozen." },
  { q: "What is “Budmo”?",
    options: ["A greeting", "A swear word", "A dessert", "A toast, like skål"], answer: 3,
    note: "It means “let us be”." },
  { q: "True or false: Ukrainians smile at strangers on the street to be polite.",
    options: ["True", "False"], answer: 1,
    note: "Smiles are for people they know. Not rudeness, just honesty." },
  { q: "True or false: In Ukraine, “How are you?” is a polite greeting that expects no real answer.",
    options: ["True", "False"], answer: 1,
    note: "It is a real question. Ask it and you will get an answer, possibly a long one." },
  { q: "“Normalno” means:",
    options: ["Fine", "Great", "Could be better", "All of the above"], answer: 3,
    note: "Context required." },
  { q: "How many dishes are on the table on Ukrainian Christmas Eve?",
    options: ["3", "7", "12", "24"], answer: 2,
    note: "Twelve meatless dishes on Sviat Vechir, one per apostle, starting when the first star appears." },
  { q: "When is Christmas in Ukraine?",
    options: ["7 January", "25 December", "Whenever grandmother says"], answer: 2,
    note: "Officially 25 December since 2023, formerly 7 January. In practice, grandmother decides." },
  { q: "True or false: Whistling indoors means you will lose money.",
    options: ["True", "False"], answer: 0,
    note: "Whistle indoors and you whistle your money away." },
  { q: "Before leaving on a journey, Ukrainians traditionally…",
    options: ["Eat a varenyk", "Sit down in silence for a moment", "Turn around three times"], answer: 1,
    note: "A moment of silence before the road. Even if the taxi is honking." },
  { q: "Before 2022, how much of the world's sunflower oil exports came from Ukraine?",
    options: ["About 5%", "About 15%", "Nearly half"], answer: 2,
    note: "Ukraine was the world's largest sunflower oil exporter, with close to half of all exports in 2021. The sunflower is the national flower." },
  { q: "Ukraine declared independence from the Soviet Union in…",
    options: ["1989", "1991", "1994", "2004"], answer: 1,
    note: "24 August 1991, confirmed by a referendum in December where 92% voted yes." },
  { q: "Which footballer won the Ballon d'Or in 2004?",
    options: ["Andriy Shevchenko", "Zlatan Ibrahimović", "Ronaldinho", "Thierry Henry"], answer: 0,
    note: "Andriy Shevchenko, AC Milan. Ronaldinho won the year after." },
  { q: "Pole vaulter Serhiy Bubka broke the world record how many times?",
    options: ["3", "12", "35"], answer: 2,
    note: "18 outdoor and 17 indoor records, often by a single centimetre, because his sponsor paid a bonus per record." },
  { q: "How many Ukrainians think it is fine to split the bill on a first date?",
    options: ["5%", "18%", "50%", "75%"], answer: 1,
    note: "Rating Group survey, 2021, 1,500 people: 18% accept a shared bill, 25% among women. 79% say the man should pay." },
  { q: "Which word became a wartime password because russians can not say it?",
    options: ["Borsch", "Varenyky", "Kyiv", "Palyanytsya"], answer: 3,
    note: "A hearth-baked bread. The Ukrainian “и” sound gives russians away, so it became a checkpoint test in 2022. Try saying it: pa-lya-NY-tsya." },
];

const TIERS = [
  { min: 18, label: "Honorary Ukrainian. Budmo!" },
  { min: 14, label: "You have clearly eaten varenyky before." },
  { min: 8,  label: "Promising. More borsch needed." },
  { min: 0,  label: "Welcome to Ukraine. Start with the salo." },
];

const app = document.getElementById("app");
const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  const dark = t === "dark";
  if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  themeBtn.setAttribute("aria-pressed", String(dark));
  themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
}
themeBtn.addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
applyTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
let state, screen = { kind: "start" };

function reset() { state = { answers: Array(QUESTIONS.length).fill(null) }; renderStart(); }
function correctCount() { return state.answers.filter((a, k) => a !== null && a === QUESTIONS[k].answer).length; }
function firstUnanswered() { const k = state.answers.indexOf(null); return k === -1 ? QUESTIONS.length : k; }

function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

function renderStart() {
  screen = { kind: "start" };
  app.innerHTML = "";
  const card = el(`
    <section class="card">
      <span class="tag">Quiz</span>
      <h1>How Ukrainian are you?</h1>
      <p class="muted">${QUESTIONS.length} questions. Tap an answer and it locks, so think first. At the end you get your result in percent.</p>
      <button class="btn" id="start">Start</button>
      <div class="preview">
        <h3>Preview endings · temporary</h3>
        <div class="row" id="endings"></div>
      </div>
    </section>`);
  card.querySelector("#start").addEventListener("click", () => renderQuestion(0));
  const row = card.querySelector("#endings");
  [["confetti", "1 · Confetti"], ["sunflowers", "2 · Sunflower shower"], ["varenyk", "3 · Varenyk verdict"], ["stamp", "4 · Budmo stamp"]].forEach(([key, label]) => {
    const b = el(`<button class="chip" type="button">${label}</button>`);
    b.addEventListener("click", () => renderResult({ effect: key, demo: 17 }));
    row.appendChild(b);
  });
  app.appendChild(card);
}

function renderQuestion(n) {
  const q = QUESTIONS[n], picked = state.answers[n], answered = picked !== null;
  const reviewing = answered && n < firstUnanswered() - 1 || (answered && firstUnanswered() === QUESTIONS.length);
  screen = { kind: "question", n };
  app.innerHTML = "";
  const card = el(`
    <section class="card">
      <div class="progress"><span>Question ${n + 1} of ${QUESTIONS.length}${reviewing ? " · answered" : ""}</span><span>${correctCount()} correct</span></div>
      <div class="bar"><div style="width:${(n / QUESTIONS.length) * 100}%"></div></div>
      <h2>${q.q}</h2>
      <div class="opts" role="group" aria-label="Answers"></div>
      <div id="feedback"></div>
      <div class="nav" id="nav"></div>
    </section>`);
  const opts = card.querySelector(".opts");
  q.options.forEach((text, idx) => {
    const b = el(`<button class="opt" data-idx="${idx}"><span class="mark" aria-hidden="true">✓</span><span>${text}</span></button>`);
    b.addEventListener("click", () => pick(n, idx, card));
    opts.appendChild(b);
  });
  app.appendChild(card);
  if (answered) showLocked(n, card); else renderNav(n, card);
  window.scrollTo({ top: 0 });
}

function pick(n, idx, card) {
  if (state.answers[n] !== null) return;
  state.answers[n] = idx;
  showLocked(n, card);
  const next = card.querySelector("#next");
  if (next) next.focus();
}

function showLocked(n, card) {
  const q = QUESTIONS[n], picked = state.answers[n], ok = picked === q.answer;
  card.querySelectorAll(".opt").forEach(b => {
    const i = Number(b.dataset.idx);
    b.disabled = true;
    if (i === q.answer) { b.classList.add("correct"); b.querySelector(".mark").textContent = "✓"; }
    else if (i === picked) { b.classList.add("wrong"); b.querySelector(".mark").textContent = "✕"; }
    else b.classList.add("dim");
  });
  card.querySelector(".progress span:last-child").textContent = `${correctCount()} correct`;
  card.querySelector("#feedback").innerHTML = `
    <p class="verdict ${ok ? "ok" : "bad"}">${ok ? "Correct!" : "Not quite."}</p>
    <p class="note">${q.note}</p>`;
  renderNav(n, card);
}

function renderNav(n, card) {
  const nav = card.querySelector("#nav");
  const answered = state.answers[n] !== null;
  const last = n === QUESTIONS.length - 1;
  nav.innerHTML = "";
  if (n > 0) {
    const back = el(`<button class="btn secondary small" id="back" aria-label="Back to previous question">← Back</button>`);
    back.addEventListener("click", () => renderQuestion(n - 1));
    nav.appendChild(back);
  }
  if (answered) {
    const next = el(`<button class="btn" id="next">${last ? "See my result" : "Next"}</button>`);
    next.addEventListener("click", () => { if (last) renderResult(); else renderQuestion(n + 1); });
    nav.appendChild(next);
  } else if (n > 0) {
    nav.appendChild(el(`<p class="muted hint">Earlier answers can be viewed but not changed.</p>`));
  }
}

const reducedMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const EFFECTS = {
  confetti(card, c, total) {
    if (reducedMotion()) return;
    const cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
    const ctx = cv.getContext("2d"), dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const colors = ["#0057B7", "#FFD700", "#ffffff", "#7fb3ff", "#ffe866"];
    const n = Math.round(40 + 240 * (c / total)), ps = [];
    const ox = innerWidth / 2, oy = Math.min(innerHeight * 0.35, 320);
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3, sp = 7 + Math.random() * 11;
      ps.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: 6 + Math.random() * 6, h: 9 + Math.random() * 9,
        r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, col: colors[i % colors.length] });
    }
    const t0 = performance.now(); let last = t0;
    function frame(now) {
      const dt = Math.min((now - last) / 16.7, 2); last = now;
      const age = now - t0, fade = Math.max(0, 1 - Math.max(0, age - 2600) / 900);
      ctx.clearRect(0, 0, cv.width, cv.height); ctx.globalAlpha = fade;
      for (const p of ps) {
        p.vy += 0.28 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
        ctx.save(); ctx.translate(p.x * dpr, p.y * dpr); ctx.rotate(p.r); ctx.fillStyle = p.col;
        ctx.fillRect(-p.w / 2 * dpr, -p.h / 2 * dpr, p.w * dpr, p.h * dpr); ctx.restore();
      }
      if (age < 3600) requestAnimationFrame(frame); else cv.remove();
    }
    requestAnimationFrame(frame);
  },
  sunflowers(card, c, total) {
    if (reducedMotion()) return;
    const layer = document.createElement("div"); layer.className = "shower"; document.body.appendChild(layer);
    const n = c <= 7 ? 3 : Math.round(10 + 30 * (c / total));
    for (let i = 0; i < n; i++) {
      const f = document.createElement("span"); f.textContent = "🌻";
      f.style.left = Math.random() * 96 + "vw";
      f.style.fontSize = (22 + Math.random() * 28) + "px";
      f.style.setProperty("--sway", (Math.random() * 160 - 80).toFixed(0) + "px");
      f.style.animationDuration = (3.5 + Math.random() * 3) + "s";
      f.style.animationDelay = (Math.random() * 2) + "s";
      layer.appendChild(f);
    }
    setTimeout(() => layer.remove(), 9000);
  },
  varenyk(card, c, total) {
    const mood = c >= 18 ? "happy" : c >= 8 ? "neutral" : "sad";
    const crimp = [];
    for (let k = 0; k <= 10; k++) {
      const a = Math.PI - Math.PI * k / 10;
      crimp.push(`<circle cx="${(130 + 90 * Math.cos(a)).toFixed(1)}" cy="${(125 - 90 * Math.sin(a)).toFixed(1)}" r="7" fill="#f2dca3" stroke="#c79a3b" stroke-width="3"/>`);
    }
    const face = mood === "happy"
      ? `<path d="M96 88 q10 -12 20 0"/><path d="M144 88 q10 -12 20 0"/><path d="M108 102 q22 22 44 0"/>
         <circle cx="88" cy="100" r="6" fill="#f4a7a3" stroke="none" opacity=".8"/><circle cx="172" cy="100" r="6" fill="#f4a7a3" stroke="none" opacity=".8"/>`
      : mood === "neutral"
      ? `<circle cx="106" cy="86" r="4.5" fill="#3a2a10" stroke="none"/><circle cx="154" cy="86" r="4.5" fill="#3a2a10" stroke="none"/><path d="M114 106 h32"/>`
      : `<circle cx="106" cy="86" r="4.5" fill="#3a2a10" stroke="none"/><circle cx="154" cy="86" r="4.5" fill="#3a2a10" stroke="none"/><path d="M112 110 q18 -14 36 0"/>
         <path d="M160 94 q7 11 0 16 q-7 -5 0 -16z" fill="#7fb3ff" stroke="none"/>`;
    const cream = mood === "happy"
      ? `<path d="M98 52 q32 -34 64 0 q-8 16 -32 12 q-24 6 -32 -12z" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>
         <path d="M118 44 l-6 -10 M127 40 l-2 -12 M137 41 l5 -12" fill="none" stroke="#5aa64a" stroke-width="2.5" stroke-linecap="round"/>` : "";
    const caption = mood === "happy" ? "The varenyk approves." : mood === "neutral" ? "The varenyk is thinking about it." : "The varenyk is sad. More borsch.";
    const svg = el(`<svg class="varenyk" viewBox="0 0 260 170" aria-hidden="true">
      <ellipse class="plate" cx="130" cy="136" rx="120" ry="26" stroke-width="3"/>
      <ellipse class="rim" cx="130" cy="136" rx="98" ry="17" stroke-width="2"/>
      <path d="M40 125 A90 90 0 0 1 220 125 Z" fill="#f2dca3" stroke="#c79a3b" stroke-width="3"/>
      ${crimp.join("")}${cream}
      <g fill="none" stroke="#3a2a10" stroke-width="3.5" stroke-linecap="round">${face}</g>
    </svg>`);
    const ring = card.querySelector(".ring"); if (ring) ring.remove();
    card.querySelector(".tag").insertAdjacentElement("afterend", svg);
    card.querySelector(".tier").insertAdjacentHTML("afterend", `<p class="caption">${caption}</p>`);
  },
  stamp(card, c, total) {
    const word = c >= 18 ? "Budmo!" : c >= 14 ? "Smachnoho!" : c >= 8 ? "Normalno" : "More borsch";
    card.insertAdjacentHTML("beforeend", `<div class="stamp" aria-hidden="true">${word}</div>`);
  },
};

const FINAL_EFFECT = null; // the chosen ending goes here once picked

function renderResult(opts = {}) {
  const total = QUESTIONS.length;
  const demo = Number.isInteger(opts.demo);
  const c = demo ? opts.demo : correctCount();
  const effect = opts.effect === undefined ? FINAL_EFFECT : opts.effect;
  const pct = Math.round((c / total) * 100);
  const tier = TIERS.find(t => c >= t.min).label;
  const r = 70, circ = 2 * Math.PI * r, dash = circ * (c / total);
  screen = demo ? { kind: "start" } : { kind: "result" };
  app.innerHTML = "";
  const card = el(`
    <section class="card score">
      <span class="tag">Result</span>
      <svg class="ring" viewBox="0 0 160 160" aria-hidden="true">
        <circle class="track" cx="80" cy="80" r="${r}" fill="none" stroke-width="14"/>
        <circle class="arc" cx="80" cy="80" r="${r}" fill="none" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="${dash} ${circ}" transform="rotate(-90 80 80)"/>
        <text x="80" y="92" text-anchor="middle" font-size="40" font-weight="900">${pct}<tspan font-size="20">%</tspan></text>
      </svg>
      <h1>You are ${pct}% Ukrainian</h1>
      <p class="count">${c} of ${total} correct</p>
      <p class="tier">${tier}</p>
      ${demo
        ? `<div class="row demo" id="demo"></div><button class="btn secondary" id="again" style="margin-top:14px">Back to endings</button>`
        : `<button class="btn" id="again">Start over</button><button class="btn secondary" id="review">Review my answers</button>`}
    </section>`);
  if (demo) {
    const row = card.querySelector("#demo");
    [19, 15, 10, 4].forEach(n => {
      const b = el(`<button class="chip${n === c ? " on" : ""}" type="button">${n} / ${total}</button>`);
      b.addEventListener("click", () => renderResult({ effect, demo: n }));
      row.appendChild(b);
    });
    card.querySelector("#again").addEventListener("click", renderStart);
  } else {
    card.querySelector("#again").addEventListener("click", reset);
    card.querySelector("#review").addEventListener("click", () => renderQuestion(0));
  }
  app.appendChild(card);
  window.scrollTo({ top: 0 });
  if (effect && EFFECTS[effect]) EFFECTS[effect](card, c, total);
}

function boot(data) {
  const a = data && data.answers;
  if (Array.isArray(a) && a.length === QUESTIONS.length) {
    state = { answers: a };
    if (data.screen === "result") renderResult();
    else if (data.screen === "question" && Number.isInteger(data.n)) renderQuestion(Math.min(data.n, QUESTIONS.length - 1));
    else renderStart();
  } else reset();
}
window.claude?.hot?.snapshot?.(() => ({ answers: state.answers, screen: screen.kind, n: screen.n }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
