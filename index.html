<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Ukrainian are you?</title>
<meta name="description" content="A 20-question quiz about Ukraine. Pick an answer, see if you were right, find out how Ukrainian you are.">
<style>
  :root {
    --blue: #0057B7;
    --blue-dark: #00458f;
    --yellow: #FFD700;
    --ink: #14181f;
    --muted: #5d6673;
    --paper: #ffffff;
    --bg: #f3f5f9;
    --line: #dde2ea;
    --ok: #1f8a3b;
    --ok-bg: #e6f5ea;
    --bad: #c62828;
    --bad-bg: #fde8e8;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4; -webkit-font-smoothing: antialiased;
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  .flag { display: flex; height: 8px; }
  .flag span { flex: 1; }
  .flag .b { background: var(--blue); }
  .flag .y { background: var(--yellow); }
  main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 20px 16px 32px; }
  .card {
    background: var(--paper); border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    padding: 24px 20px;
  }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -.01em; }
  h2 { font-size: 22px; line-height: 1.25; margin: 0 0 18px; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .tag {
    display: inline-block; background: var(--blue); color: var(--yellow);
    font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 6px; margin-bottom: 14px;
  }
  .btn {
    display: block; width: 100%; border: 0; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 17px;
    padding: 15px 18px; border-radius: 12px;
    background: var(--blue); color: #fff;
    transition: background .15s, transform .05s;
  }
  .btn:hover { background: var(--blue-dark); }
  .btn:active { transform: translateY(1px); }
  .btn.secondary { background: transparent; color: var(--blue); border: 2px solid var(--blue); }
  .btn.secondary:hover { background: #eef4fc; }
  .btn + .btn { margin-top: 10px; }

  .progress { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
  .bar > div { height: 100%; background: var(--yellow); width: 0; transition: width .3s; }

  .opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .opt {
    text-align: left; width: 100%; border: 2px solid var(--line); background: #fff;
    font: inherit; font-size: 17px; color: var(--ink);
    padding: 14px 16px; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    transition: border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--blue); background: #f6f9fe; }
  .opt:disabled { cursor: default; }
  .opt .mark {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: transparent;
  }
  .opt.correct { border-color: var(--ok); background: var(--ok-bg); }
  .opt.correct .mark { border-color: var(--ok); background: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.wrong .mark { border-color: var(--bad); background: var(--bad); color: #fff; }
  .opt.dim { opacity: .55; }

  .verdict { font-weight: 800; font-size: 18px; margin: 0 0 6px; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .note { border-left: 4px solid var(--yellow); padding: 2px 0 2px 12px; margin: 0 0 18px; color: var(--ink); }

  .score { text-align: center; }
  .pct { font-size: 72px; font-weight: 900; line-height: 1; color: var(--blue); letter-spacing: -.03em; }
  .pct small { font-size: 36px; }
  .count { font-size: 18px; color: var(--muted); margin: 8px 0 18px; }
  .tier { font-size: 22px; font-weight: 800; margin: 0 0 22px; }
  .ring { width: 160px; height: 160px; margin: 0 auto 16px; display: block; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 10px 16px 18px; }
  .sr { position: absolute; left: -9999px; }
  @media (max-width: 380px) { h1 { font-size: 26px; } .pct { font-size: 60px; } }
</style>
</head>
<body>
<div class="flag"><span class="b"></span><span class="y"></span></div>
<main id="app" aria-live="polite"></main>
<footer>Gro Community · Ukrainian afterwork · Växjö, October 2026</footer>

<script>
const QUESTIONS = [
  { q: "What is Ukraine's currency?",
    options: ["Hryvnia", "Lev", "Zloty", "Lari"], answer: 0,
    note: "The hryvnia, ₴. Named after a unit of weight used in Kyivan Rus a thousand years ago." },
  { q: "What is a vyshyvanka?",
    options: ["An embroidered shirt", "A soup", "A dance", "A fur hat"], answer: 0,
    note: "The embroidered shirt. Every region has its own pattern, and there is a Vyshyvanka Day every May." },
  { q: "When was Ukraine's capital, Kyiv, founded?",
    options: ["482", "988", "1240", "1654"], answer: 0,
    note: "Officially 482, so Kyiv celebrated its 1,500th birthday in 1982. Stockholm was first mentioned in 1252." },
  { q: "True or false: Swedes founded a village in Ukraine in 1782, and a few people there still speak old Swedish.",
    options: ["True", "False"], answer: 0,
    note: "Gammalsvenskby in Kherson oblast, founded by Swedes from the island of Dagö. A handful of elderly villagers still speak the old dialect." },
  { q: "True or false: The last time a large Swedish army visited Ukraine, in 1709, it went well for Sweden.",
    options: ["True", "False"], answer: 1,
    note: "Battle of Poltava, 8 July 1709. Karl XII and Hetman Ivan Mazepa fought side by side and lost to Peter the Great." },
  { q: "You are invited to a Ukrainian home and bring flowers. How many?",
    options: ["10", "12", "11"], answer: 2,
    note: "Always an odd number. Even numbers are for funerals, so florists sell 11, 25 or 51 roses, never a dozen." },
  { q: "What is “Budmo”?",
    options: ["A toast, like skål", "A swear word", "A greeting", "A dessert"], answer: 0,
    note: "It means “let us be”. Shout it and the room answers “Hey!”" },
  { q: "True or false: Ukrainians smile at strangers on the street to be polite.",
    options: ["True", "False"], answer: 1,
    note: "Smiles are for people they know. Not rudeness, just honesty. Once you are a friend, you cannot make them stop." },
  { q: "True or false: In Ukraine, “How are you?” is a polite greeting that expects no real answer.",
    options: ["True", "False"], answer: 1,
    note: "It is a real question. Ask it and you will get an answer, possibly a long one." },
  { q: "“Normalno” means:",
    options: ["Fine", "Great", "Terrible", "All of the above"], answer: 3,
    note: "Context required." },
  { q: "How many dishes are on the table on Ukrainian Christmas Eve?",
    options: ["3", "7", "12", "24"], answer: 2,
    note: "Twelve meatless dishes on Sviat Vechir, one per apostle, starting when the first star appears." },
  { q: "When is Christmas in Ukraine?",
    options: ["7 January", "25 December", "Whenever grandmother says"], answer: 2,
    note: "Officially 25 December since 2023, formerly 7 January. In practice, grandmother decides." },
  { q: "True or false: Whistling indoors means you will lose money.",
    options: ["True", "False"], answer: 0,
    note: "Whistle indoors and you whistle your money away." },
  { q: "Before leaving on a journey, Ukrainians traditionally…",
    options: ["Sit down in silence for a moment", "Eat a varenyk", "Turn around three times"], answer: 0,
    note: "A moment of silence before the road. Even if the taxi is honking." },
  { q: "Before 2022, how much of the world's sunflower oil exports came from Ukraine?",
    options: ["About 5%", "About 15%", "Nearly half"], answer: 2,
    note: "Ukraine was the world's largest sunflower oil exporter, with close to half of all exports in 2021. The sunflower is the national flower." },
  { q: "Ukraine declared independence from the Soviet Union in…",
    options: ["1989", "1991", "1994", "2004"], answer: 1,
    note: "24 August 1991, confirmed by a referendum in December where 92% voted yes." },
  { q: "Which footballer won the Ballon d'Or in 2004?",
    options: ["Zlatan Ibrahimović", "Ronaldinho", "Andriy Shevchenko", "Thierry Henry"], answer: 2,
    note: "Andriy Shevchenko, AC Milan. Ronaldinho won the year after. Zlatan never has." },
  { q: "Pole vaulter Serhiy Bubka broke the world record how many times?",
    options: ["3", "12", "35"], answer: 2,
    note: "18 outdoor and 17 indoor records, often by a single centimetre, because his sponsor paid a bonus per record." },
  { q: "How many Ukrainian women will suggest to split the bill on a first date?",
    options: ["5%", "25%", "50%", "75%"], answer: 1,
    note: "A 2021 survey of 1,500 Ukrainians: one in four women was fine with splitting, and 79% said the man pays." },
  { q: "Which word became a wartime password because russians can not say it?",
    options: ["Borsch", "Palyanytsya", "Varenyky", "Kyiv"], answer: 1,
    note: "A hearth-baked bread. The Ukrainian “и” sound gives russians away, so it became a checkpoint test in 2022. Try saying it: pa-lya-NY-tsya." },
];

const TIERS = [
  { min: 18, label: "Honorary Ukrainian. Budmo!" },
  { min: 14, label: "You have clearly eaten varenyky before." },
  { min: 8,  label: "Promising. More borsch needed." },
  { min: 0,  label: "Welcome to Ukraine. Start with the salo." },
];

const app = document.getElementById("app");
let state;

function reset() { state = { i: 0, correct: 0, picked: null }; renderStart(); }

function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

function renderStart() {
  app.innerHTML = "";
  const card = el(`
    <section class="card">
      <span class="tag">Quiz</span>
      <h1>How Ukrainian are you?</h1>
      <p class="muted">${QUESTIONS.length} questions. Tap an answer and it locks, so think first. At the end you get your result in percent.</p>
      <button class="btn" id="start">Start</button>
    </section>`);
  card.querySelector("#start").addEventListener("click", () => { renderQuestion(); });
  app.appendChild(card);
}

function renderQuestion() {
  const n = state.i, q = QUESTIONS[n];
  app.innerHTML = "";
  const card = el(`
    <section class="card">
      <div class="progress"><span>Question ${n + 1} of ${QUESTIONS.length}</span><span>${state.correct} correct</span></div>
      <div class="bar"><div style="width:${(n / QUESTIONS.length) * 100}%"></div></div>
      <h2>${q.q}</h2>
      <div class="opts" role="group" aria-label="Answers"></div>
      <div id="feedback"></div>
    </section>`);
  const opts = card.querySelector(".opts");
  q.options.forEach((text, idx) => {
    const b = el(`<button class="opt" data-idx="${idx}"><span class="mark" aria-hidden="true">✓</span><span>${text}</span></button>`);
    b.addEventListener("click", () => pick(idx, card));
    opts.appendChild(b);
  });
  app.appendChild(card);
  window.scrollTo({ top: 0 });
}

function pick(idx, card) {
  if (state.picked !== null) return;
  state.picked = idx;
  const q = QUESTIONS[state.i];
  const ok = idx === q.answer;
  if (ok) state.correct++;
  card.querySelectorAll(".opt").forEach(b => {
    const i = Number(b.dataset.idx);
    b.disabled = true;
    if (i === q.answer) { b.classList.add("correct"); b.querySelector(".mark").textContent = "✓"; }
    else if (i === idx) { b.classList.add("wrong"); b.querySelector(".mark").textContent = "✕"; }
    else b.classList.add("dim");
  });
  card.querySelector(".progress span:last-child").textContent = `${state.correct} correct`;
  const last = state.i === QUESTIONS.length - 1;
  const fb = card.querySelector("#feedback");
  fb.innerHTML = `
    <p class="verdict ${ok ? "ok" : "bad"}">${ok ? "Correct!" : "Not quite."}</p>
    <p class="note">${q.note}</p>
    <button class="btn" id="next">${last ? "See my result" : "Next question"}</button>`;
  const next = fb.querySelector("#next");
  next.addEventListener("click", () => {
    state.i++; state.picked = null;
    if (state.i >= QUESTIONS.length) renderResult(); else renderQuestion();
  });
  next.focus();
}

function renderResult() {
  const total = QUESTIONS.length, c = state.correct;
  const pct = Math.round((c / total) * 100);
  const tier = TIERS.find(t => c >= t.min).label;
  const r = 70, circ = 2 * Math.PI * r, dash = circ * (c / total);
  app.innerHTML = "";
  const card = el(`
    <section class="card score">
      <span class="tag">Result</span>
      <svg class="ring" viewBox="0 0 160 160" aria-hidden="true">
        <circle cx="80" cy="80" r="${r}" fill="none" stroke="#dde2ea" stroke-width="14"/>
        <circle cx="80" cy="80" r="${r}" fill="none" stroke="#FFD700" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="${dash} ${circ}" transform="rotate(-90 80 80)"/>
        <text x="80" y="92" text-anchor="middle" font-size="40" font-weight="900" fill="#0057B7">${pct}<tspan font-size="20">%</tspan></text>
      </svg>
      <h1>You are ${pct}% Ukrainian</h1>
      <p class="count">${c} of ${total} correct</p>
      <p class="tier">${tier}</p>
      <button class="btn" id="again">Start over</button>
    </section>`);
  card.querySelector("#again").addEventListener("click", reset);
  app.appendChild(card);
  window.scrollTo({ top: 0 });
}

reset();
</script>
</body>
</html>
