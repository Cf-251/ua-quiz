<style>
  /* Layout: one centred card column, flag bands top and bottom, phone first. */
  :root {
    --blue: #0057B7;
    --blue-dark: #00458f;
    --blue-text: #0057B7;
    --yellow: #FFD700;
    --ink: #14181f;
    --muted: #5d6673;
    --paper: #ffffff;
    --paper-hover: #f6f9fe;
    --bg: #f3f5f9;
    --line: #dde2ea;
    --ok: #1f8a3b;
    --ok-bg: #e6f5ea;
    --bad: #c62828;
    --bad-bg: #fde8e8;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --radius: 14px;
  }
  :root[data-theme="dark"] {
    --blue-text: #7fb3ff; --ink: #eef2f7; --muted: #9aa6b5; --paper: #1a212c; --paper-hover: #202a37;
    --bg: #10151d; --line: #2c3645; --ok: #4ccb6f; --ok-bg: #16331f; --bad: #ff7b7b; --bad-bg: #3a1c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased;
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  .flag { display: flex; height: 8px; }
  .flag span { flex: 1; }
  .flag .b { background: var(--blue); }
  .flag .y { background: var(--yellow); }
  main {
    flex: 1; width: 100%; max-width: 592px; margin: 0 auto;
    padding-block: 16px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 10px; }
  .lang { display: flex; align-items: center; gap: 2px; height: 42px; padding: 3px; border: 2px solid var(--line); border-radius: 999px; background: var(--paper); }
  .lang button { font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .04em; border: 0; background: transparent; color: var(--muted); padding: 7px 10px; border-radius: 999px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .lang button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; }
  .theme {
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    border: 2px solid var(--line); background: var(--paper); color: var(--ink);
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: border-color .15s, background .15s;
  }
  .theme:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .theme svg { width: 20px; height: 20px; display: block; }
  .theme .sun { display: none; }
  :root[data-theme="dark"] .theme .sun { display: block; }
  :root[data-theme="dark"] .theme .moon { display: none; }
  .card {
    background: var(--paper); border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 30px 20px 26px;
  }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -.01em; text-wrap: balance; }
  h2 { font-size: 22px; line-height: 1.25; margin: 0 0 18px; text-wrap: balance; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .tag {
    display: inline-block; background: var(--blue); color: var(--yellow);
    font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 6px; margin-bottom: 14px;
  }
  .btn {
    display: block; width: 100%; border: 0; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 17px;
    padding: 15px 18px; border-radius: 12px;
    background: var(--blue); color: #fff;
    transition: background .15s, transform .05s;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, .opt:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .btn.secondary { background: transparent; color: var(--blue-text); border: 2px solid var(--blue-text); }
  .btn + .btn { margin-top: 10px; }

  .progress { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 14px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
  .bar > div { height: 100%; background: var(--yellow); width: 0; transition: width .3s; }

  .opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .opt {
    text-align: left; width: 100%; border: 2px solid var(--line); background: var(--paper);
    font: inherit; font-size: 17px; color: var(--ink);
    padding: 14px 16px; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    transition: border-color .15s, background .15s;
  }
  .opt > span:last-child { min-width: 0; }
  .opt:disabled { cursor: default; }
  .opt .mark {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: transparent;
  }
  .opt.correct { border-color: var(--ok); background: var(--ok-bg); }
  .opt.correct .mark { border-color: var(--ok); background: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.wrong .mark { border-color: var(--bad); background: var(--bad); color: #fff; }
  .opt.dim { opacity: .55; }

  .nav { display: flex; gap: 10px; align-items: center; }
  .nav .btn { margin: 0; }
  .nav .btn.small { width: auto; flex: 0 0 auto; padding: 13px 16px; font-size: 15px; }
  .nav .hint { margin: 0; font-size: 13px; }
  .verdict { font-weight: 800; font-size: 18px; margin: 0 0 6px; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .note { border-left: 4px solid var(--yellow); padding: 2px 0 2px 12px; margin: 0 0 18px; color: var(--ink); }

  .score { text-align: center; }
  .count { font-size: 18px; color: var(--muted); margin: 8px 0 18px; font-variant-numeric: tabular-nums; }
  .tier { font-size: 22px; font-weight: 800; margin: 0 0 22px; }
  .ring { width: 160px; height: 160px; max-width: 100%; margin: 0 auto 16px; display: block; }
  .ring .track { stroke: var(--line); }
  .ring .arc { stroke: var(--yellow); }
  .ring text { fill: var(--blue-text); font-family: inherit; }
  .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
  .card.score { position: relative; }
  footer {
    text-align: center; font-size: 12px; color: var(--muted);
    padding-block: 10px 18px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (hover: hover) and (pointer: fine) {
    .btn:hover { background: var(--blue-dark); }
    .btn.secondary:hover { background: var(--paper-hover); }
    .theme:hover { border-color: var(--blue-text); background: var(--paper-hover); }
    .opt:hover:not(:disabled) { border-color: var(--blue-text); background: var(--paper-hover); }
  }
  @media (prefers-reduced-motion: reduce) { .bar > div, .btn, .opt { transition: none; } }
  @media (max-width: 380px) { h1 { font-size: 26px; } }
</style>
</head>

      theme_dark: "Увімкнути темний режим", theme_light: "Увімкнути світлий режим", language: "Мова",
    },
    tiers: ["Свій серед своїх. Будьмо!", "Вареники тобі точно не вперше.", "Непогано. Потрібно більше борщу.", "Ласкаво просимо в Україну. Почни з сала."],
    questions: [
      { q: "Яка валюта України?", options: ["Лев (лв)", "Злотий (zł)", "Гривня (₴)", "Ларі (₾)"],
        note: "Гривня, ₴. Назва походить від вагової одиниці часів Київської Русі, тисячу років тому." },
      { q: "Що таке вишиванка?", options: ["Суп", "Танець", "Хутряна шапка", "Вишита сорочка"],
        note: "Вишита сорочка. У кожного регіону свій візерунок, а День вишиванки святкують у третій четвер травня." },
      { q: "Коли заснували Київ, столицю України?", options: ["482", "988", "1240", "1654"],
        note: "Офіційно 482 року, тож 1982-го Київ святкував своє 1500-річчя." },
      { q: "Правда чи ні: 1782 року шведи заснували в Україні село, і дехто там досі говорить старошведською.", options: ["Правда", "Неправда"],
        note: "Старошведське на Херсонщині, засноване шведами з естонського острова Гіюмаа. Кілька літніх мешканців досі говорять старим діалектом." },
      { q: "Правда чи ні: Коли велика шведська армія востаннє навідалася в Україну 1709 року, для Швеції все склалося добре.", options: ["Правда", "Неправда"],
        note: "Полтавська битва, 8 липня 1709 року. Карл XII і гетьман Іван Мазепа билися пліч-о-пліч і програли Петру I." },
      { q: "Тебе запросили в гості до українців, і ти несеш квіти. Скільки?", options: ["10", "12", "11"],
        note: "Завжди непарну кількість. Парна — для похорону, тому флористи продають 11, 25 чи 51 троянду, але ніколи не дюжину." },
      { q: "Що таке «Будьмо»?", options: ["Привітання", "Лайка", "Десерт", "Тост, як шведське skål"],
        note: "Побажання просто бути. Так піднімають келих." },
      { q: "Правда чи ні: Українці усміхаються незнайомцям на вулиці з ввічливості.", options: ["Правда", "Неправда"],
        note: "Усмішка — для знайомих. Це не грубість, а щирість." },
      { q: "Правда чи ні: В Україні «Як справи?» — просто ввічливе вітання, на яке не чекають відповіді.", options: ["Правда", "Неправда"],
        note: "Це справжнє запитання. Постав його, і отримаєш відповідь, можливо, довгу." },
      { q: "«Нормально» означає:", options: ["Добре", "Чудово", "Могло б бути краще", "Усе перелічене"],
        note: "Залежить від контексту." },
      { q: "Скільки страв на столі на Святвечір?", options: ["3", "7", "12", "24"],
        note: "Дванадцять пісних страв, по одній на кожного апостола. Починають, коли зійде перша зірка." },
      { q: "Коли в Україні Різдво?", options: ["7 січня", "25 грудня", "Коли скаже бабуся"],
        note: "Офіційно 25 грудня з 2023 року, раніше 7 січня. На практиці вирішує бабуся." },
      { q: "Правда чи ні: Свистіти в хаті — до безгрошів'я.", options: ["Правда", "Неправда"],
        note: "Посвистиш у хаті — висвистиш гроші." },
      { q: "Перед дорогою українці традиційно…", options: ["З'їдають вареник", "Сідають на хвилинку й мовчать", "Обертаються тричі"],
        note: "Хвилинка тиші перед дорогою. Навіть якщо таксі сигналить." },
      { q: "Яка частка світового експорту соняшникової олії припадала на Україну до 2022 року?", options: ["Близько 5%", "Близько 15%", "Майже половина"],
        note: "Україна була найбільшим у світі експортером соняшникової олії: майже половина всього експорту 2021 року. Соняшник — національна квітка." },
      { q: "Україна проголосила незалежність від Радянського Союзу в…", options: ["1989", "1991", "1994", "2004"],
        note: "24 серпня 1991 року. На референдумі в грудні 92% сказали «так»." },
      { q: "Хто з футболістів отримав «Золотий м'яч» 2004 року?", options: ["Андрій Шевченко", "Златан Ібрагімович", "Роналдіньо", "Тьєррі Анрі"],
        note: "Андрій Шевченко, «Мілан». Роналдіньо виграв наступного року." },
      { q: "Скільки разів стрибун із жердиною Сергій Бубка бив світовий рекорд?", options: ["3", "12", "35"],
        note: "18 разів просто неба і 17 у залі, часто на один сантиметр, бо спонсор платив бонус за кожен рекорд." },
      { q: "Скільки українців вважають нормальним розділити рахунок на першому побаченні?", options: ["5%", "18%", "50%", "75%"],
        note: "Опитування Rating Group, 2021, 1500 осіб: 18% допускають спільну оплату, серед жінок 25%. 79% вважають, що платити має чоловік." },
      { q: "Яке слово стало паролем під час війни, бо росіяни не можуть його вимовити?", options: ["Борщ", "Вареники", "Київ", "Паляниця"],
        note: "Хліб із печі. Український звук «и» видає росіян, тож 2022 року слово стало перевіркою на блокпостах." },
    ],
  },
};

const app = document.getElementById("app");
const themeBtn = document.getElementById("theme");
const langBox = document.getElementById("lang");
let state, screen = { kind: "start" }, lang = "en";

const T = () => I18N[lang].ui;
const Q = n => I18N[lang].questions[n];
const fmt = (str, v) => str.replace(/\{(\w+)\}/g, (_, k) => v[k]);

function applyTheme(t) {
  const dark = t === "dark";
  if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  themeBtn.setAttribute("aria-pressed", String(dark));
  themeBtn.setAttribute("aria-label", dark ? T().theme_light : T().theme_dark);
  try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
}
themeBtn.addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

function applyLang(l, rerender = true) {
  if (!I18N[l]) l = "en";
  lang = l;
  document.documentElement.lang = l;
  document.title = T().title;
  langBox.setAttribute("aria-label", T().language);
  langBox.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  themeBtn.setAttribute("aria-label", document.documentElement.dataset.theme === "dark" ? T().theme_light : T().theme_dark);
  try { localStorage.setItem("lang", l); } catch (e) {}
  if (rerender) {
    if (screen.kind === "question") renderQuestion(screen.n);
    else if (screen.kind === "result") renderResult();
    else renderStart();
  }
}
langBox.addEventListener("click", e => { const b = e.target.closest("button[data-lang]"); if (b) applyLang(b.dataset.lang); });

function reset() { state = { answers: Array(N).fill(null) }; renderStart(); }
function correctCount() { return state.answers.filter((a, k) => a !== null && a === ANSWERS[k]).length; }
function firstUnanswered() { const k = state.answers.indexOf(null); return k === -1 ? N : k; }

function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

function renderStart() {
  screen = { kind: "start" };
  const t = T();
  app.innerHTML = "";
  const card = el(`
    <section class="card">
      <span class="tag">${t.quiz}</span>
      <h1>${t.title}</h1>
      <p class="muted">${fmt(t.intro, { n: N })}</p>
      <button class="btn" id="start">${t.start}</button>
    </section>`);
  card.querySelector("#start").addEventListener("click", () => renderQuestion(0));
  app.appendChild(card);
}

function renderQuestion(n) {
  const t = T(), q = Q(n), picked = state.answers[n], answered = picked !== null;
  const reviewing = answered && (n < firstUnanswered() - 1 || firstUnanswered() === N);
  screen = { kind: "question", n };
  app.innerHTML = "";
  const card = el(`
    <section class="card">
      <div class="progress"><span>${fmt(t.question_of, { i: n + 1, n: N })}${reviewing ? " · " + t.answered : ""}</span><span>${fmt(t.correct_count, { c: correctCount() })}</span></div>
      <div class="bar"><div style="width:${(n / N) * 100}%"></div></div>
      <h2>${q.q}</h2>
      <div class="opts" role="group"></div>
      <div id="feedback"></div>
      <div class="nav" id="nav"></div>
    </section>`);
  const opts = card.querySelector(".opts");
  q.options.forEach((text, idx) => {
    const b = el(`<button class="opt" data-idx="${idx}"><span class="mark" aria-hidden="true">✓</span><span>${text}</span></button>`);
    b.addEventListener("click", () => pick(n, idx, card));
    opts.appendChild(b);
  });
  app.appendChild(card);
  if (answered) showLocked(n, card); else renderNav(n, card);
  window.scrollTo({ top: 0 });
}

function pick(n, idx, card) {
  if (state.answers[n] !== null) return;
  state.answers[n] = idx;
  showLocked(n, card);
  const next = card.querySelector("#next");
  if (next) next.focus();
}

function showLocked(n, card) {
  const t = T(), q = Q(n), picked = state.answers[n], ok = picked === ANSWERS[n];
  card.querySelectorAll(".opt").forEach(b => {
    const i = Number(b.dataset.idx);
    b.disabled = true;
    if (i === ANSWERS[n]) { b.classList.add("correct"); b.querySelector(".mark").textContent = "✓"; }
    else if (i === picked) { b.classList.add("wrong"); b.querySelector(".mark").textContent = "✕"; }
    else b.classList.add("dim");
  });
  card.querySelector(".progress span:last-child").textContent = fmt(t.correct_count, { c: correctCount() });
  card.querySelector("#feedback").innerHTML = `
    <p class="verdict ${ok ? "ok" : "bad"}">${ok ? t.correct : t.wrong}</p>
    <p class="note">${q.note}</p>`;
  renderNav(n, card);
}

function renderNav(n, card) {
  const t = T(), nav = card.querySelector("#nav");
  const answered = state.answers[n] !== null, last = n === N - 1;
  nav.innerHTML = "";
  if (n > 0) {
    const back = el(`<button class="btn secondary small" id="back" aria-label="${t.back_label}">${t.back}</button>`);
    back.addEventListener("click", () => renderQuestion(n - 1));
    nav.appendChild(back);
  }
  if (answered) {
    const next = el(`<button class="btn" id="next">${last ? t.see_result : t.next}</button>`);
    next.addEventListener("click", () => { if (last) renderResult(); else renderQuestion(n + 1); });
    nav.appendChild(next);
  } else if (n > 0) {
    nav.appendChild(el(`<p class="muted hint">${t.hint}</p>`));
  }
}

const reducedMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function confetti(c, total) {
  if (reducedMotion()) return;
  const cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
  const ctx = cv.getContext("2d"), dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const colors = ["#0057B7", "#FFD700", "#ffffff", "#7fb3ff", "#ffe866"];
  const n = Math.round(40 + 240 * (c / total)), ps = [];
  const ox = innerWidth / 2, oy = Math.min(innerHeight * 0.35, 320);
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3, sp = 7 + Math.random() * 11;
    ps.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: 6 + Math.random() * 6, h: 9 + Math.random() * 9,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, col: colors[i % colors.length] });
  }
  const t0 = performance.now(); let last = t0;
  function frame(now) {
    const dt = Math.min((now - last) / 16.7, 2); last = now;
    const age = now - t0, fade = Math.max(0, 1 - Math.max(0, age - 2600) / 900);
    ctx.clearRect(0, 0, cv.width, cv.height); ctx.globalAlpha = fade;
    for (const p of ps) {
      p.vy += 0.28 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      ctx.save(); ctx.translate(p.x * dpr, p.y * dpr); ctx.rotate(p.r); ctx.fillStyle = p.col;
      ctx.fillRect(-p.w / 2 * dpr, -p.h / 2 * dpr, p.w * dpr, p.h * dpr); ctx.restore();
    }
    if (age < 3600) requestAnimationFrame(frame); else cv.remove();
  }
  requestAnimationFrame(frame);
}

function renderResult() {
  const t = T(), c = correctCount();
  const pct = Math.round((c / N) * 100);
  const tiers = I18N[lang].tiers;
  const tier = c >= 18 ? tiers[0] : c >= 14 ? tiers[1] : c >= 8 ? tiers[2] : tiers[3];
  const r = 70, circ = 2 * Math.PI * r, dash = circ * (c / N);
  const firstTime = screen.kind !== "result";
  screen = { kind: "result" };
  app.innerHTML = "";
  const card = el(`
    <section class="card score">
      <span class="tag">${t.result}</span>
      <svg class="ring" viewBox="0 0 160 160" aria-hidden="true">
        <circle class="track" cx="80" cy="80" r="${r}" fill="none" stroke-width="14"/>
        <circle class="arc" cx="80" cy="80" r="${r}" fill="none" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="${dash} ${circ}" transform="rotate(-90 80 80)"/>
        <text x="80" y="92" text-anchor="middle" font-size="40" font-weight="900">${pct}<tspan font-size="20">%</tspan></text>
      </svg>
      <h1>${fmt(t.you_are, { p: pct })}</h1>
      <p class="count">${fmt(t.of_correct, { c, n: N })}</p>
      <p class="tier">${tier}</p>
      <button class="btn" id="again">${t.start_over}</button>
      <button class="btn secondary" id="review">${t.review}</button>
    </section>`);
  card.querySelector("#again").addEventListener("click", reset);
  card.querySelector("#review").addEventListener("click", () => renderQuestion(0));
  app.appendChild(card);
  window.scrollTo({ top: 0 });
  if (firstTime) confetti(c, N);
}

function boot(data) {
  let saved = null; try { saved = localStorage.getItem("lang"); } catch (e) {}
  applyLang(saved || "en", false);
  applyTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
  const a = data && data.answers;
  if (Array.isArray(a) && a.length === N) {
    state = { answers: a };
    if (data.screen === "result") renderResult();
    else if (data.screen === "question" && Number.isInteger(data.n)) renderQuestion(Math.min(data.n, N - 1));
    else renderStart();
  } else reset();
}
window.claude?.hot?.snapshot?.(() => ({ answers: state.answers, screen: screen.kind, n: screen.n }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
